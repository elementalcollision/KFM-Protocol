name: Publish KFM Docker Images

on:
  push:
    branches:
      - main # Trigger on pushes to the main branch
    # Optionally trigger only when specific service code changes:
    # paths:
    #   - 'api_gateway_service/**'
    #   - 'agent_registry_service/**'
    #   - ...etc...

jobs:
  # --- API Gateway Service --- 
  build_and_push_api_gateway:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Needed for GitHub Container Registry (ghcr.io)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install dependencies for testing
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 
      - name: Install API Gateway Dependencies
        run: pip install --no-cache-dir --upgrade pip && pip install --no-cache-dir -r api_gateway_service/requirements.txt

      # Run tests before building
      - name: Run API Gateway Tests
        run: pytest api_gateway_service/tests # Assumes tests are in service/tests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub # Replace with your registry if different
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }} # Needs to be configured in repo secrets
          password: ${{ secrets.DOCKERHUB_TOKEN }}   # Needs to be configured in repo secrets
        # For GitHub Container Registry (ghcr.io) use:
        # registry: ghcr.io
        # username: ${{ github.actor }}
        # password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API Gateway image
        uses: docker/build-push-action@v5
        with:
          context: ./api_gateway_service # Build context is the service directory
          file: ./api_gateway_service/Dockerfile
          push: true
          # Replace with your registry/image name
          tags: |
            your-dockerhub-username/kfm-api-gateway:latest
            your-dockerhub-username/kfm-api-gateway:${{ github.sha }}
          # For GitHub Container Registry:
          # tags: |
          #   ghcr.io/${{ github.repository_owner }}/kfm-api-gateway:latest
          #   ghcr.io/${{ github.repository_owner }}/kfm-api-gateway:${{ github.sha }}

      # - name: Deploy to Kubernetes (Placeholder)
      #   run: |
      #     echo "Deployment step placeholder for api-gateway"
      #     # Add commands here to update Kubernetes manifests (e.g., using kubectl set image or kustomize)
      #     # and apply them using kubectl apply -f ...
      #     # Requires setting up kubectl context with cluster credentials (e.g., via secrets)

