apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: kfm-observability # Assuming observability components are in this namespace
  labels:
    k8s-app: filebeat
data:
  filebeat.yml: |
    filebeat.autodiscover:
      providers:
        - type: kubernetes
          node: ${NODE_NAME:localhost} # Use NODE_NAME env var, default to localhost if not set
          hints.enabled: true
          hints.default_config:
            type: container
            paths:
              - /var/log/containers/*${data.kubernetes.container.id}.log
          templates:
            - condition:
                # Example: Target logs from namespaces starting with 'kfm-'
                contains:
                  kubernetes.namespace: "kfm-" 
              config:
                - type: container
                  paths:
                    - /var/log/containers/*${data.kubernetes.container.id}.log
                  json.keys_under_root: true  # Expect JSON logs
                  json.add_error_key: true    # Add error key if parsing fails
                  json.message_key: message # Optional: specify the key containing the main log message

    # Add Kubernetes metadata processor
    processors:
      - add_kubernetes_metadata:
          host: ${NODE_NAME:localhost}
          matchers:
          - logs_path:
              logs_path: "/var/log/containers/"

    # Add cloud metadata processor (optional, useful for cloud deployments)
    # processors:
    #  - add_cloud_metadata: ~

    # Output to Logstash
    output.logstash:
      hosts: ["logstash-service.kfm-observability.svc.cluster.local:5044"] # Use Logstash service name and namespace
      # Optional: Add load balancing or TLS settings if needed
      # loadbalance: true
      # ssl.enabled: true
      # ssl.certificate_authorities: ["/path/to/ca.crt"]

    # Optional: Configure internal Filebeat logging
    # logging.level: info
    # logging.to_files: false
    # logging.to_stderr: true 