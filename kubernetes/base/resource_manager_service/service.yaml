apiVersion: v1
kind: Service
metadata:
  name: resource-manager-service
  namespace: kfm-system # Use the same namespace as the Deployment
  labels:
    app: resource-manager
spec:
  selector:
    app: resource-manager # Selects pods with the 'app: resource-manager' label
  ports:
    - name: http
      protocol: TCP
      port: 8000 # Port the service listens on
      targetPort: 8000 # Port the container listens on (from Deployment)
  # Expose internally within the cluster
  type: ClusterIP 