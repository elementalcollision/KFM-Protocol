apiVersion: apps/v1
kind: Deployment
metadata:
  name: f-operator-deployment
  namespace: kfm-operators # Define a namespace (or adjust as needed)
  labels:
    app: f-operator
spec:
  replicas: 1 # Start with 1, can scale later
  selector:
    matchLabels:
      app: f-operator
  template:
    metadata:
      labels:
        app: f-operator
      # Add annotations for Prometheus scraping
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8000' 
    spec:
      containers:
        - name: f-operator
          # Replace with your actual image name/registry path
          image: your-registry/kfm-f-operator:latest 
          ports:
            - containerPort: 8000 # Port the application listens on
              name: http
          # Liveness and readiness probes
          livenessProbe:
            httpGet:
              path: /health # Assuming a /health endpoint exists
              port: 8000
            initialDelaySeconds: 20 
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          # Define resource requests and limits
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m" 
            limits:
              memory: "512Mi"
              cpu: "500m" 
          # Environment variables for DB, Git credentials, etc.
          envFrom:
            - configMapRef:
                name: f-operator-config
            - secretRef:
                name: f-operator-secrets # e.g., DB password, Git token 