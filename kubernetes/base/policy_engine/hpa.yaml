apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: policy-engine-hpa
  namespace: kfm-system # Use the same namespace as the Deployment
  labels:
    app: policy-engine
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: policy-engine-deployment # Name of the Deployment to scale
  minReplicas: 1 # Matches Deployment initial replicas
  maxReplicas: 3 # Allow scaling up to 3 replicas
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70 # Target 70% CPU utilization
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75 # Target 75% Memory utilization 